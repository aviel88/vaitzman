<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תפריט | מסעדת ויצמן אשדוד - מטבח מרוקאי אותנטי</title>
  <meta name="description" content="תפריט מסעדת ויצמן: סלטים מרוקאיים, בשרים על הגריל, תבשילים מסורתיים, לחמים טריים וקינוחים ביתיים.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="תפריט | מסעדת ויצמן אשדוד - מטבח מרוקאי אותנטי">
  <meta property="og:description" content="תפריט מסעדת ויצמן: סלטים מרוקאיים, בשרים על הגריל, תבשילים מסורתיים, לחמים טריים וקינוחים ביתיים.">
  <meta property="og:type" content="restaurant">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Menu loader/empty states */
    .menu-loader {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-light);
    }
    .menu-loader .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(201,147,58,0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: menuSpin 0.9s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes menuSpin { to { transform: rotate(360deg); } }
    .menu-error {
      text-align: center;
      padding: 3rem 1.5rem;
      background: rgba(192,57,43,0.1);
      border: 1px solid rgba(192,57,43,0.4);
      border-radius: 10px;
      color: var(--cream);
      max-width: 600px;
      margin: 2rem auto;
    }
    .menu-error i { font-size: 2.4rem; color: #e74c3c; margin-bottom: 1rem; display: block; }
    .menu-error h3 { color: var(--cream); margin-bottom: 0.5rem; font-size: 1.3rem; }
    .menu-error p { color: var(--text-light); font-size: 0.95rem; }
    .menu-error button {
      margin-top: 1.25rem;
      background: var(--gold);
      color: var(--charcoal);
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 5px;
      font-family: 'Heebo', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-error button:hover { background: var(--gold-light); }
    .menu-empty {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-light);
    }
    .menu-empty i { font-size: 2.8rem; color: var(--border-gold); margin-bottom: 1rem; display: block; }
  </style>
</head>
<body>

<header id="site-header"></header>

<!-- PAGE HERO -->
<section class="page-hero" aria-label="כותרת תפריט">
  <div class="page-hero-content">
    <div class="hero-badge">התפריט שלנו</div>
    <h1 class="fade-in">תפריט <span class="gold">ויצמן</span></h1>
    <div class="ornament" style="margin: 0.8rem auto 1rem;" aria-hidden="true"></div>
    <p class="fade-in fade-in-delay-1">מנות מרוקאיות אותנטיות מוכנות מדי יום בטריות מרבית</p>
  </div>
</section>

<!-- MENU CONTENT -->
<main class="menu-section" id="main-content">

  <!-- Dynamic menu container -->
  <div id="menuContainer">
    <div class="menu-loader" id="menuLoader">
      <div class="spinner"></div>
      <p>טוען את התפריט...</p>
    </div>
  </div>

  <!-- NOTE -->
  <div class="menu-note fade-in" id="menuNote" style="display:none;">
    <i class="fas fa-info-circle" aria-hidden="true"></i>
    <strong>לתשומת לבכם:</strong> כל המנות מוכנות טריות מדי יום. התפריט עשוי להשתנות בהתאם לעונה ולזמינות. לשאלות ולהזמנות מיוחדות צרו קשר: <strong><a href="tel:088522593" style="color:var(--gold);">08-852-2593</a></strong>
  </div>

  <!-- CTA -->
  <div style="text-align:center; margin-top:4rem;" class="fade-in" id="menuCta" style="display:none;">
    <p style="color:var(--text-light); margin-bottom:1.5rem; font-size:1rem;">רוצים לטעום? הזמינו שולחן עכשיו</p>
    <a href="reservation.html" class="btn-gold">הזמינו שולחן</a>
  </div>

</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
/* ── Supabase config ── */
const SUPABASE_URL = 'https://umdtmwndmojticrgppib.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eqPvn3xRV8fYH4lBXa0GLg_xm-M1vZP';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── Category metadata (defines the EXACT display order) ── */
const CATEGORY_META = {
  'מנות ראשונות וסלטים': { icon: 'fa-leaf',        order: 1 },
  'מנות עיקריות':         { icon: 'fa-fire',        order: 2 },
  'תבשילים':              { icon: 'fa-bowl-food',   order: 3 },
  'לחמים מהתנור':        { icon: 'fa-bread-slice', order: 4 },
  'קינוחים':              { icon: 'fa-ice-cream',   order: 5 },
  'שתייה':                { icon: 'fa-mug-hot',     order: 6 },
};
// Unknown categories fall back to order 99 → rendered last

function escapeHtml(s='') {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function groupByCategory(items) {
  const groups = {};
  items.forEach(it => {
    const cat = it.category || 'אחר';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(it);
  });
  // Sort categories by the predefined order
  return Object.keys(groups)
    .sort((a, b) => (CATEGORY_META[a]?.order || 99) - (CATEGORY_META[b]?.order || 99))
    .map(cat => ({ name: cat, items: groups[cat] }));
}

function renderMenu(items) {
  const container = document.getElementById('menuContainer');
  const note = document.getElementById('menuNote');
  const cta = document.getElementById('menuCta');

  if (!items.length) {
    container.innerHTML = `
      <div class="menu-empty">
        <i class="fas fa-utensils"></i>
        <p>התפריט בעדכון. אנא חזרו אלינו בקרוב.</p>
      </div>
    `;
    note.style.display = 'block';
    cta.style.display = 'block';
    return;
  }

  const grouped = groupByCategory(items);
  container.innerHTML = grouped.map(group => {
    const meta = CATEGORY_META[group.name] || { icon: 'fa-utensils' };
    const itemsHtml = group.items.map(it => `
      <div class="menu-item">
        <h4>${escapeHtml(it.name)}</h4>
        ${it.description ? `<p>${escapeHtml(it.description)}</p>` : ''}
      </div>
    `).join('');
    return `
      <div class="menu-category fade-in" aria-labelledby="cat-${meta.order || 'x'}">
        <div class="menu-category-header">
          <i class="fas ${meta.icon}" aria-hidden="true"></i>
          <h2>${escapeHtml(group.name)}</h2>
        </div>
        <div class="menu-grid">${itemsHtml}</div>
      </div>
    `;
  }).join('');

  note.style.display = 'block';
  cta.style.display = 'block';

  // Re-observe fade-in for the new dynamic content
  if (typeof IntersectionObserver !== 'undefined') {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });
    container.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
  }
}

function showError(message) {
  const container = document.getElementById('menuContainer');
  container.innerHTML = `
    <div class="menu-error">
      <i class="fas fa-exclamation-triangle"></i>
      <h3>אירעה שגיאה בטעינת התפריט</h3>
      <p>${escapeHtml(message || 'לא הצלחנו להתחבר לשרת. אנא נסו לרענן את הדף.')}</p>
      <p style="margin-top:0.75rem; font-size:0.88rem;">לעזרה ניתן ליצור קשר: <a href="tel:088522593" style="color:var(--gold);">08-852-2593</a></p>
      <button onclick="loadMenu()">נסו שוב</button>
    </div>
  `;
}

async function loadMenu() {
  const container = document.getElementById('menuContainer');
  container.innerHTML = `
    <div class="menu-loader">
      <div class="spinner"></div>
      <p>טוען את התפריט...</p>
    </div>
  `;

  try {
    const { data, error } = await supa
      .from('menu_items')
      .select('id, name, category, description, is_available')
      .eq('is_available', true)
      .order('category', { ascending: true })
      .order('created_at', { ascending: true });

    if (error) {
      console.error('Supabase error:', error);
      showError(error.message);
      return;
    }
    renderMenu(data || []);
  } catch (e) {
    console.error('Fetch error:', e);
    showError('לא הצלחנו להגיע לשרת. בדקו את החיבור לאינטרנט ונסו שוב.');
  }
}

document.addEventListener('DOMContentLoaded', loadMenu);
</script>
</body>
</html>
